name: One-time ASHA auth fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-fix-asha-auth.yml'

permissions:
  contents: write

jobs:
  fix-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch ASHA authentication flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/page.tsx')
          text = path.read_text()

          old_merge = ("const mergeCloudUser = (source: User[], cloudUser: CloudUser) => {\n"
                       "  const matchIndex = cloudUser.isPrimaryAdmin\n"
                       "    ? 0\n"
                       "    : source.findIndex(\n"
                       "        (user) =>\n"
                       "          normalizeUsername(user.username || \"\") ===\n"
                       "          normalizeUsername(cloudUser.username),\n"
                       "      );")
          new_merge = ("const mergeCloudUser = (source: User[], cloudUser: CloudUser) => {\n"
                       "  const matchIndex = source.findIndex(\n"
                       "    (user) =>\n"
                       "      user.cloudId === cloudUser.id ||\n"
                       "      normalizeUsername(user.username || \"\") ===\n"
                       "        normalizeUsername(cloudUser.username),\n"
                       "  );")
          if old_merge not in text:
              raise SystemExit('mergeCloudUser pattern not found')
          text = text.replace(old_merge, new_merge, 1)

          old_init = ("        setUsers(merged.users);\n"
                      "        setCurrentUserId(merged.userId);\n"
                      "        setProfessionalName(cloudUser.fullName);\n"
                      "        const stateResponse=await fetch(\"/api/clinic-state\",{credentials:\"same-origin\",cache:\"no-store\",headers:{Accept:\"application/json\"}});")
          new_init = ("        setUsers(merged.users);\n"
                      "        setCurrentUserId(merged.userId);\n"
                      "        setProfessionalName(cloudUser.fullName);\n"
                      "        setHydrated(true);\n"
                      "        setAuthReady(true);\n"
                      "        setBootstrapState(\"configured\");\n"
                      "        const stateResponse=await fetch(\"/api/clinic-state\",{credentials:\"same-origin\",cache:\"no-store\",headers:{Accept:\"application/json\"}});")
          if old_init not in text:
              raise SystemExit('initialize pattern not found')
          text = text.replace(old_init, new_init, 1)

          old_login = ("      const cloudUser=data.user as CloudUser,merged=mergeCloudUser([],cloudUser);setUsers(merged.users);setCurrentUserId(merged.userId);setProfessionalName(cloudUser.fullName);\n"
                       "      const stateResponse=await fetch(\"/api/clinic-state\",{credentials:\"same-origin\",cache:\"no-store\"}),stateData=await stateResponse.json().catch(()=>({}));\n"
                       "      if(!stateResponse.ok||stateData?.ok!==true)return typeof stateData?.error===\"string\"?stateData.error:\"No se pudo cargar la información.\";\n"
                       "      const state=stateData.state&&typeof stateData.state===\"object\"?stateData.state as Record<string,unknown>:{};\n"
                       "      setPatients(Array.isArray(state.patients)?state.patients as Patient[]:[]);setServices(Array.isArray(state.services)?state.services as Service[]:[]);setProducts(Array.isArray(state.products)?state.products as Product[]:[]);setTxs(Array.isArray(state.txs)?state.txs as Tx[]:[]);setAppointments(Array.isArray(state.appointments)?state.appointments as Appointment[]:[]);setAttentions(Array.isArray(state.attentions)?state.attentions as Attention[]:[]);primeRuntimeState(state);setCloudReady(true);setBootstrapState(\"configured\");return \"\";")
          new_login = ("      const cloudUser=data.user as CloudUser,merged=mergeCloudUser([],cloudUser);\n"
                       "      setUsers(merged.users);setCurrentUserId(merged.userId);setProfessionalName(cloudUser.fullName);setHydrated(true);setBootstrapState(\"configured\");setCloudReady(false);\n"
                       "      void (async()=>{\n"
                       "        try{\n"
                       "          const stateResponse=await fetch(\"/api/clinic-state\",{credentials:\"same-origin\",cache:\"no-store\"}),stateData=await stateResponse.json().catch(()=>({}));\n"
                       "          if(!stateResponse.ok||stateData?.ok!==true)throw new Error(typeof stateData?.error===\"string\"?stateData.error:\"No se pudo cargar la información de Supabase.\");\n"
                       "          const state=stateData.state&&typeof stateData.state===\"object\"?stateData.state as Record<string,unknown>:{};\n"
                       "          setPatients(Array.isArray(state.patients)?state.patients as Patient[]:[]);setServices(Array.isArray(state.services)?state.services as Service[]:[]);setProducts(Array.isArray(state.products)?state.products as Product[]:[]);setTxs(Array.isArray(state.txs)?state.txs as Tx[]:[]);setAppointments(Array.isArray(state.appointments)?state.appointments as Appointment[]:[]);setAttentions(Array.isArray(state.attentions)?state.attentions as Attention[]:[]);if(typeof state.professionalName===\"string\"&&state.professionalName.trim())setProfessionalName(state.professionalName);primeRuntimeState(state);setCloudReady(true);\n"
                       "        }catch(error){setFlash(error instanceof Error?error.message:\"No se pudo cargar la información de Supabase.\")}\n"
                       "      })();\n"
                       "      return \"\";")
          if old_login not in text:
              raise SystemExit('login pattern not found')
          text = text.replace(old_login, new_login, 1)
          path.write_text(text)
          PY
      - name: Commit definitive fix
        shell: bash
        run: |
          git config user.name "ASHA maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "Fix primary admin login and decouple cloud loading"
          git push origin main
