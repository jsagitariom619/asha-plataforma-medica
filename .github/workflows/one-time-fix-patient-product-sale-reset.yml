name: Fix patient product sale reset
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-fix-patient-product-sale-reset.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply scoped correction
        run: python scripts/fix-patient-product-sale-reset.py
      - name: Install dependencies
        run: npm run install:ci
      - name: Build and regression tests
        run: npm test
      - name: Commit functional file only
        run: |
          git config user.name "ASHA maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add components/patient-product-sales.tsx
          git commit -m "fix(patient): reset product sale form between openings" || exit 0
          git push origin main
