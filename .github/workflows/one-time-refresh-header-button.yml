name: Add refresh header button
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-refresh-header-button.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply scoped correction
        run: python scripts/add-refresh-header-button.py
      - name: Install dependencies
        run: npm install
      - name: Build and regression tests
        run: npm run build && npm test
      - name: Commit functional file only
        run: |
          git config user.name "ASHA maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx
          if git diff --cached --quiet; then
            echo "No functional changes"
            exit 0
          fi
          git commit -m "feat(ui): add refresh button beside notifications"
          git push origin main
