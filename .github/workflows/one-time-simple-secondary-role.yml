name: Apply ASHA simple secondary roles
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-simple-secondary-role.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply role patch
        run: python scripts/simple-secondary-role.py
      - name: Install dependencies
        run: npm run install:ci
      - name: Build and test
        run: npm test
      - name: Commit role simplification
        run: |
          git config user.name "ASHA maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx app/products.tsx
          git commit -m "fix(roles): keep secondary users operational without master edits" || exit 0
          git push origin main
