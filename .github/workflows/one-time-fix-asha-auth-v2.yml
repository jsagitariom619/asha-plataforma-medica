name: Run definitive ASHA auth patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-fix-asha-auth-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply auth patch
        run: python scripts/fix_asha_auth_once.py
      - name: Commit patched source
        run: |
          git config user.name "ASHA maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "Fix primary admin login and decouple cloud loading"
          git push origin main
