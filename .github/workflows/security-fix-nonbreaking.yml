name: ASHA staged non-breaking dependency fixes
on:
  push:
    branches:
      - security/dependency-hardening-20260909
    paths:
      - '.github/workflows/security-fix-nonbreaking.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/dependency-hardening-20260909
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact current dependencies
        run: npm ci
      - name: Patch production framework first
        run: npm install --save-exact next@16.3.4 && npm install --save-dev --save-exact eslint-config-next@16.3.4
      - name: Apply remaining non-breaking remediation
        run: npm audit fix || true
      - name: Build and regression tests
        run: npm test
      - name: Remaining production audit
        run: npm audit --omit=dev || true
      - name: Commit only dependency metadata
        run: |
          git config user.name "ASHA security maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: update Next.js and safe transitive dependencies" || exit 0
          git push origin security/dependency-hardening-20260909
