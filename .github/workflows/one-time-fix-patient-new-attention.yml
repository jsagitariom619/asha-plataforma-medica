name: Fix patient new attention context
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-fix-patient-new-attention.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply scoped correction
        run: python scripts/fix-patient-new-attention-context.py
      - name: Install dependencies
        run: npm ci
      - name: Build and regression tests
        run: npm test
      - name: Commit functional files only
        run: |
          git config user.name "ASHA maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx components/patient-profile.tsx
          git commit -m "fix(clinical): keep patient context for new attention" || exit 0
          git push origin main
