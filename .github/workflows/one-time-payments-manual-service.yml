name: Add payments module and manual appointment service
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-payments-manual-service.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply scoped correction
        run: python scripts/add-payments-and-manual-appointment-service.py
      - name: Install dependencies
        run: npm install
      - name: Build and regression tests
        run: npm test
      - name: Commit functional file only
        run: |
          git config user.name "ASHA maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat(finance): restore payments module and manual appointment service"
          git push
