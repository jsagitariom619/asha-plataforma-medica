name: Apply ASHA safe consistency cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-safe-consistency-cleanup.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply low-risk cleanup
        run: python scripts/safe-consistency-cleanup.py
      - name: Install dependencies
        run: npm run install:ci
      - name: Test
        run: npm test
      - name: Commit cleanup
        run: |
          git config user.name "ASHA maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx app/layout.tsx scripts/install-ci.sh
          git commit -m "chore: remove stale placeholders and test styling" || exit 0
          git push origin main
